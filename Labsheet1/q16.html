<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 16 - Basic Student Table</title>
</head>
<body>
    <!-- 
      Question 16:
      Create an HTML table (<table>) with 3 rows and 3 columns containing student 
      information using <tr>, <th>, and <td> tags.
    -->
    <h1>Student Information Table</h1>

    <table border="1" cellpadding="8" cellspacing="0">
        <!-- Row 1: Header row -->
        <tr>
            <th>Roll Number</th>
            <th>Student Name</th>
            <th>Course</th>
        </tr>
        <!-- Row 2: Student 1 -->
        <tr>
            <td>101</td>
            <td>Aarav Sharma</td>
            <td>B.Tech CSE</td>
        </tr>
        <!-- Row 3: Student 2 -->
        <tr>
            <td>102</td>
            <td>Priya Verma</td>
            <td>B.Tech IT</td>
        </tr>
    </table>
</body>
</html>
