<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 13 - Clickable Image Link</title>
</head>
<body>
    <!-- 
      Question 13:
      Design a webpage containing an image that, when clicked, redirects the user to an 
      external website using an anchor tag (<a>).
    -->
    <h1>Clickable Image Link</h1>
    <p>Click on the image below to visit the official Wikipedia homepage:</p>

    <a href="https://www.wikipedia.org/" target="_blank" title="Visit Wikipedia">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Wikipedia-logo-v2.svg/300px-Wikipedia-logo-v2.svg.png" 
             alt="Wikipedia Logo" 
             width="200" 
             height="200">
    </a>
</body>
</html>
