<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 14 - Figure and Figcaption</title>
</head>
<body>
    <!-- 
      Question 14:
      Implement an image layout using the <figure> and <figcaption> tags to display a 
      photograph with a descriptive caption.
    -->
    <h1>Image with Caption using &lt;figure&gt; and &lt;figcaption&gt;</h1>

    <figure>
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" 
             alt="Scenic view of Yosemite Valley with mountains and river" 
             width="550">
        <figcaption>Figure 1: Serene view of Yosemite Valley during sunrise, showcasing majestic granite peaks and pristine river reflections.</figcaption>
    </figure>
</body>
</html>
