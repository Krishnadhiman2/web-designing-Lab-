<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 11 - Mouseover &amp; Mouseout Event Handlers</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; background: #f8fafc; text-align: center; }
        .wrapper { max-width: 500px; margin: auto; }
        /* The interactive box */
        #interactiveCard {
            width: 100%;
            height: 220px;
            background-color: #e2e8f0;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #334155;
            cursor: pointer;
            border: 3px dashed #94a3b8;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.2s;
        }
        .color-palette {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .color-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <!-- 
      Question 11:
      Write a JavaScript event handler for mouseover and mouseout events to change the 
      background color of an HTML element dynamically.
    -->
    <div class="wrapper">
        <h2>Mouseover &amp; Mouseout Dynamic Styler</h2>
        <p>Hover your mouse pointer over the card below:</p>

        <div id="interactiveCard">
            <span id="statusText">Hover over me!</span>
            <small style="font-size: 13px; font-weight: normal; margin-top: 6px;">(Default Background: #e2e8f0)</small>
        </div>

        <p style="margin-top: 20px; color: #64748b; font-size: 14px;">Select hover highlight color:</p>
        <div class="color-palette">
            <div class="color-dot" style="background: #3b82f6;" onclick="setHoverColor('#3b82f6')"></div>
            <div class="color-dot" style="background: #10b981;" onclick="setHoverColor('#10b981')"></div>
            <div class="color-dot" style="background: #f59e0b;" onclick="setHoverColor('#f59e0b')"></div>
            <div class="color-dot" style="background: #ec4899;" onclick="setHoverColor('#ec4899')"></div>
        </div>
    </div>

    <script>
        const card = document.getElementById("interactiveCard");
        const statusText = document.getElementById("statusText");
        
        let hoverColor = "#3b82f6";
        const defaultColor = "#e2e8f0";

        function setHoverColor(newColor) {
            hoverColor = newColor;
        }

        // JavaScript event handler for 'mouseover'
        card.addEventListener("mouseover", function() {
            card.style.backgroundColor = hoverColor;
            card.style.color = "#ffffff";
            card.style.borderColor = "transparent";
            card.style.transform = "scale(1.03)";
            statusText.textContent = "Mouse Over! (Color: " + hoverColor + ")";
        });

        // JavaScript event handler for 'mouseout'
        card.addEventListener("mouseout", function() {
            card.style.backgroundColor = defaultColor;
            card.style.color = "#334155";
            card.style.borderColor = "#94a3b8";
            card.style.transform = "scale(1)";
            statusText.textContent = "Hover over me!";
        });
    </script>
</body>
</html>
