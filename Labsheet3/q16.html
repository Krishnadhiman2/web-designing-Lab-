<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 16 - Dynamic Image Gallery Slider</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .gallery-box { max-width: 550px; background: #1e293b; padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .slide-img { width: 100%; height: 320px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
        .caption { font-size: 16px; color: #38bdf8; margin-bottom: 15px; font-weight: bold; }
        .btn-controls { display: flex; justify-content: space-between; align-items: center; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 22px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; }
        button:hover { background: #2563eb; }
        .counter { color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>
    <!-- 
      Question 16:
      Create a dynamic image gallery slider using JavaScript arrays to cycle through image 
      sources upon clicking 'Next' and 'Previous' buttons.
    -->
    <div class="gallery-box">
        <h2>Dynamic Image Slider</h2>
        <img id="sliderImage" class="slide-img" src="" alt="Gallery Slide">
        <div id="imageCaption" class="caption">Image Caption</div>

        <div class="btn-controls">
            <button onclick="prevSlide()">&larr; Previous</button>
            <span id="slideCounter" class="counter">1 / 4</span>
            <button onclick="nextSlide()">Next &rarr;</button>
        </div>
    </div>

    <script>
        // Array of images with source and caption
        const galleryImages = [
            {
                url: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600",
                caption: "1. Serene Yosemite Valley Mountain Range"
            },
            {
                url: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=600",
                caption: "2. Developer Workspace with Code Setup"
            },
            {
                url: "https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600",
                caption: "3. Untouched Green Wilderness Landscape"
            },
            {
                url: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600",
                caption: "4. Creative Web Designing Architecture"
            }
        ];

        let currentIndex = 0;

        function updateSlider() {
            const currentItem = galleryImages[currentIndex];
            document.getElementById("sliderImage").src = currentItem.url;
            document.getElementById("imageCaption").textContent = currentItem.caption;
            document.getElementById("slideCounter").textContent = (currentIndex + 1) + " / " + galleryImages.length;
        }

        function nextSlide() {
            // Cycle forward using modulo
            currentIndex = (currentIndex + 1) % galleryImages.length;
            updateSlider();
        }

        function prevSlide() {
            // Cycle backward
            currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
            updateSlider();
        }

        // Initialize first slide on page load
        updateSlider();
    </script>
</body>
</html>
