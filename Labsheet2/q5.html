<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 5 - Centered Login Card with Absolute Positioning</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            height: 100vh;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            position: relative; /* Context for absolute centering */
        }
        /* Centered card container using absolute positioning */
        .login-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 360px;
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px; /* border-radius */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25); /* box-shadow */
        }
        .login-card h2 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #475569;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }
        .input-group input:focus {
            outline: none;
            border-color: #4f46e5;
        }
        .btn-login {
            width: 100%;
            padding: 11px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-login:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>
    <!-- 
      Question 5:
      Design a user login interface inside a centered card container using CSS box-shadow, 
      border-radius, and absolute positioning.
    -->
    <div class="login-card">
        <h2>Member Login</h2>
        <form action="#" method="POST">
            <div class="input-group">
                <label for="user">Username or Email</label>
                <input type="text" id="user" name="user" placeholder="Enter username" required>
            </div>
            <div class="input-group">
                <label for="pass">Password</label>
                <input type="password" id="pass" name="pass" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>
</body>
</html>
