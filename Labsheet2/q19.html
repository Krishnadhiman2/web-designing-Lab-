<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 19 - Typography Rules in Form</title>
    <!-- Importing modern font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8fafc;
            padding: 40px 20px;
        }
        .form-card {
            max-width: 520px;
            margin: auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        h2 {
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #0f172a;
            font-size: 20px;
            margin-bottom: 24px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .field {
            margin-bottom: 20px;
        }
        /* CSS Typography rules for labels */
        label {
            display: block;
            font-family: 'Montserrat', sans-serif; /* font-family */
            font-size: 13px;
            font-weight: 700;
            line-height: 1.8; /* line-height */
            letter-spacing: 1.2px; /* letter-spacing */
            text-transform: uppercase; /* text-transform */
            color: #475569;
            margin-bottom: 6px;
        }
        /* Inputs styling with custom placeholder typography */
        input {
            width: 100%;
            padding: 10px 14px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }
        /* Placeholder typography styling */
        input::placeholder {
            font-family: 'Montserrat', sans-serif; /* font-family */
            letter-spacing: 0.8px; /* letter-spacing */
            text-transform: capitalize; /* text-transform */
            line-height: 1.4; /* line-height */
            color: #94a3b8;
            font-size: 13px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>
    <!-- 
      Question 19:
      Implement CSS typography rules (font-family, line-height, letter-spacing, text-transform) 
      across all labels and placeholders in a registration form.
    -->
    <div class="form-card">
        <h2>Executive Registration</h2>
        <form action="#" method="POST">
            <div class="field">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" placeholder="enter your first name" required>
            </div>

            <div class="field">
                <label for="orgName">Organization / Company</label>
                <input type="text" id="orgName" name="orgName" placeholder="enter company name" required>
            </div>

            <div class="field">
                <label for="workEmail">Official Email</label>
                <input type="email" id="workEmail" name="workEmail" placeholder="corporate email address" required>
            </div>

            <div class="field">
                <label for="designation">Designation Role</label>
                <input type="text" id="designation" name="designation" placeholder="e.g. senior software engineer">
            </div>

            <button type="submit">Complete Registration</button>
        </form>
    </div>
</body>
</html>
