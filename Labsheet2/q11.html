<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 11 - CSS Specificity (Inline, Internal &amp; External)</title>
    <!-- 1. External CSS -->
    <link rel="stylesheet" href="q11_external.css">

    <!-- 2. Internal CSS (Overrides external where matching specificity) -->
    <style>
        .form-card {
            max-width: 500px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 8px;
            /* Internal overrides external border style */
            border: 2px solid #3b82f6;
            background-color: #ffffff; /* Internal overrides external #f1f5f9 */
        }
        h2 {
            color: #1e3a8a;
            margin-bottom: 15px;
        }
        .form-row {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #94a3b8;
            border-radius: 4px;
        }
        /* Internal button style overrides external #64748b */
        .submit-btn {
            background-color: #2563eb;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- 
      Question 11:
      Write an HTML document utilizing inline, internal, and external CSS stylesheets to 
      style a contact form simultaneously, observing specificity rules.
    -->
    <div class="form-card">
        <h2>Contact Form (CSS Specificity Demo)</h2>
        <form action="#" method="POST">
            <div class="form-row">
                <!-- Inline style having the highest specificity (color: #dc2626) -->
                <label for="name" style="color: #dc2626; font-size: 15px;">Name (Styled with Inline CSS):</label>
                <input type="text" id="name" name="name" placeholder="John Doe">
            </div>

            <div class="form-row">
                <label for="email">Email (Styled with Internal CSS):</label>
                <input type="email" id="email" name="email" placeholder="john@example.com">
            </div>

            <div class="form-row">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="3"></textarea>
            </div>

            <!-- Button uses classes from external & internal, with inline style overriding background -->
            <button type="submit" class="submit-btn" style="background-color: #16a34a; padding: 12px 24px;">
                Send Message (Inline Green Overrides Internal Blue &amp; External Gray)
            </button>
        </form>
    </div>
</body>
</html>
